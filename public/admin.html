<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>后台管理 - MusicSite</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif;background:#0f0f1a;color:#e8e8f0;min-height:100vh}
        .ac{display:flex;min-height:100vh}.sb{width:220px;background:#16162a;border-right:1px solid #2a2a44;padding:20px 0;flex-shrink:0}
        .sb h2{text-align:center;font-size:18px;padding:12px 16px;color:#6c5ce7;border-bottom:1px solid #2a2a44}
        .si{padding:12px 24px;cursor:pointer;font-size:14px;color:#8888a8}.si:hover,.si.active{background:rgba(108,92,231,0.1);color:#e8e8f0;border-right:3px solid #6c5ce7}
        .main{flex:1;padding:24px;overflow-y:auto}.pt{font-size:22px;font-weight:600;margin-bottom:20px}
        .sg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.sc{background:#1a1a2e;border:1px solid #2a2a44;border-radius:12px;padding:20px;text-align:center}
        .sc .n{font-size:28px;font-weight:700;color:#6c5ce7}.sc .l{font-size:13px;color:#8888a8;margin-top:4px}
        .p{background:#1a1a2e;border:1px solid #2a2a44;border-radius:12px;padding:20px;margin-bottom:20px}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.p-t{font-size:16px;font-weight:600}
        .btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500}.bp{background:#6c5ce7;color:#fff}.bd{background:#e17055;color:#fff}.bs{padding:4px 10px;font-size:12px}
        table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #2a2a44;font-size:13px}th{color:#8888a8;font-weight:500;font-size:12px}
        .sb2{display:flex;gap:8px;margin-bottom:16px}.sb2 input{flex:1;padding:8px 14px;background:#0f0f1a;border:1px solid #2a2a44;border-radius:8px;color:#e8e8f0;font-size:13px}
        .mb{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:100}.mb.active{display:flex}
        .mbx{background:#16162a;border:1px solid #2a2a44;border-radius:12px;padding:24px;width:420px}.mbx h3{margin-bottom:16px;font-size:16px}
        .fg{margin-bottom:12px}.fg label{display:block;font-size:13px;color:#8888a8;margin-bottom:4px}.fg input,.fg select,.fg textarea{width:100%;padding:8px 12px;background:#0f0f1a;border:1px solid #2a2a44;border-radius:8px;color:#e8e8f0;font-size:13px}
        .fa{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.tc{display:none}.tc.active{display:block}.empty{text-align:center;padding:40px;color:#55556a}
    </style>
</head>
<body>
    <script>(function(){var t=localStorage.getItem("token");if(!t){window.location.replace("/login.html");return;}fetch("/api/auth/me",{headers:{Authorization:"Bearer "+t}}).then(function(r){return r.json()}).then(function(r){if(r.code!==0){localStorage.removeItem("token");window.location.replace("/login.html")}});})();</script>
    <div class="ac"><div class="sb">
        <h2>🎵 MusicSite</h2>
        <div class="si active" data-tab="dashboard">仪表盘</div>
        <div class="si" data-tab="songs">歌曲管理</div>
        <div class="si" data-tab="users">用户管理</div>
        <div class="si" data-tab="categories">分类管理</div>
        <div class="si" onclick="location.href='/'">返回首页</div>
    </div>
    <div class="main">
        <div class="tc active" id="tab-dashboard"><h1 class="pt">仪表盘</h1><div class="sg" id="statsGrid"></div>
            <div class="p"><div class="ph"><span class="p-t">最新上传</span></div>
            <table><thead><tr><th>歌曲</th><th>艺术家</th><th>分类</th><th>上传时间</th></tr></thead><tbody id="recentSongs"></tbody></table></div>
        </div>
        <div class="tc" id="tab-songs"><h1 class="pt">歌曲管理</h1>
            <div class="p"><div class="ph"><span class="p-t">歌曲列表</span><button class="btn bp" onclick="showUploadModal()">+ 上传歌曲</button></div>
            <div class="sb2"><input type="text" id="songSearch" placeholder="搜索歌曲..." oninput="dss()"></div>
            <table><thead><tr><th>ID</th><th>歌曲</th><th>艺术家</th><th>分类</th><th>播放</th><th>操作</th></tr></thead><tbody id="songsTable"></tbody></table>
        </div></div>
        <div class="tc" id="tab-users"><h1 class="pt">用户管理</h1>
            <div class="p"><div class="ph"><span class="p-t">用户列表</span><button class="btn bp" onclick="showUserModal()">+ 新建用户</button></div>
            <div class="sb2"><input type="text" id="userSearch" placeholder="搜索用户..." oninput="dsu()"></div>
            <table><thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody id="usersTable"></tbody></table>
        </div></div>
        <div class="tc" id="tab-categories"><h1 class="pt">分类管理</h1>
            <div class="p"><div class="ph"><span class="p-t">分类列表</span><button class="btn bp" onclick="showCatModal()">+ 新建分类</button></div>
            <table><thead><tr><th>ID</th><th>名称</th><th>排序</th><th>操作</th></tr></thead><tbody id="categoriesTable"></tbody></table>
        </div></div>
    </div></div>
    <div class="mb" id="uploadModal"><div class="mbx"><h3>上传歌曲</h3><form id="uf">
        <div class="fg"><label>歌曲名称 *</label><input type="text" name="title" required></div>
        <div class="fg"><label>艺术家</label><input type="text" name="artist"></div>
        <div class="fg"><label>专辑</label><input type="text" name="album"></div>
        <div class="fg"><label>分类</label><select name="category_id" id="uc"></select></div>
        <div class="fg"><label>歌词</label><textarea name="lyrics" rows="4"></textarea></div>
        <div class="fg"><label>音乐文件 (mp3/wav/flac/m4a)</label><input type="file" name="music_file" accept=".mp3,.wav,.flac,.ogg,.m4a,audio/*"></div>
        <div class="fg"><label>封面图片 (可选)</label><input type="file" name="cover_file" accept=".jpg,.jpeg,.png,.webp,image/*"></div>
        <div class="fa"><button type="button" class="btn" onclick="cm('uploadModal')">取消</button><button type="submit" class="btn bp">上传</button></div>
    </form></div></div>
    <div class="mb" id="categoryModal"><div class="mbx"><h3>新建分类</h3><form id="cf">
        <div class="fg"><label>分类名称 *</label><input type="text" name="name" required></div>
        <div class="fg"><label>排序</label><input type="number" name="sort_order" value="0"></div>
        <div class="fa"><button type="button" class="btn" onclick="cm('categoryModal')">取消</button><button type="submit" class="btn bp">创建</button></div>
    </form></div></div>
    <div class="mb" id="userModal"><div class="mbx"><h3>新建用户</h3><form id="userForm">
        <div class="fg"><label>用户名 *</label><input type="text" name="username" required minlength="2" maxlength="50"></div>
        <div class="fg"><label>密码 *</label><input type="password" name="password" required minlength="6"></div>
        <div class="fg"><label>昵称</label><input type="text" name="nickname"></div>
        <div class="fg"><label>角色</label><select name="role"><option value="user">用户</option><option value="admin">管理员</option></select></div>
        <div class="fa"><button type="button" class="btn" onclick="cm('userModal')">取消</button><button type="submit" class="btn bp">创建</button></div>
    </form></div></div>
<script>
var API="/api",token=localStorage.getItem("token")||"";
async function api(p,o){o=o||{};var r=await fetch(API+p,{headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},method:o.method||"GET",body:o.body?JSON.stringify(o.body):null});return r.json()}
function toast(m){var d=document.createElement("div");d.style.cssText="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid #2a2a44;color:#e8e8f0;padding:10px 24px;border-radius:24px;font-size:14px;z-index:999";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}
document.querySelectorAll(".si[data-tab]").forEach(function(i){i.addEventListener("click",function(){document.querySelectorAll(".si").forEach(function(x){x.classList.remove("active")});i.classList.add("active");document.querySelectorAll(".tc").forEach(function(t){t.classList.remove("active")});document.getElementById("tab-"+i.dataset.tab).classList.add("active")})});
async function ld(){var r=await api("/admin/stats");if(r.code===0){var s=r.data;document.getElementById("statsGrid").innerHTML="<div class=\"sc\"><div class=\"n\">"+s.total_songs+"</div><div class=\"l\">歌曲总数</div></div><div class=\"sc\"><div class=\"n\">"+s.total_users+"</div><div class=\"l\">用户总数</div></div><div class=\"sc\"><div class=\"n\">"+s.total_plays+"</div><div class=\"l\">总播放量</div></div><div class=\"sc\"><div class=\"n\">"+s.today_plays+"</div><div class=\"l\">今日播放</div></div>"}var sr=await api("/admin/songs?limit=5");if(sr.code===0){document.getElementById("recentSongs").innerHTML=(sr.data?.list||[]).map(function(s){return"<tr><td>"+s.title+"</td><td>"+(s.artist||"-")+"</td><td>"+(s.category_name||"-")+"</td><td>"+new Date(s.created_at).toLocaleString("zh-CN")+"</td></tr>"}).join("")||"<tr><td colspan=\"4\" class=\"empty\">暂无数据</td></tr>"}}
async function ls(p){p=p||1;var kw=document.getElementById("songSearch")?.value||"";var r=await api("/admin/songs?page="+p+"&keyword="+encodeURIComponent(kw));if(r.code===0){document.getElementById("songsTable").innerHTML=(r.data?.list||[]).map(function(s){return"<tr><td>"+s.id+"</td><td>"+s.title+"</td><td>"+(s.artist||"-")+"</td><td>"+(s.category_name||"-")+"</td><td>"+(s.play_count||0)+"</td><td><button class=\"btn bd bs\" onclick=\"ds("+s.id+")\">删除</button></td></tr>"}).join("")||"<tr><td colspan=\"6\" class=\"empty\">暂无歌曲</td></tr>"}}
async function lu(){var kw=document.getElementById("userSearch")?.value||"";var r=await api("/admin/users?keyword="+encodeURIComponent(kw));if(r.code===0){document.getElementById("usersTable").innerHTML=(r.data?.list||[]).map(function(u){var rl=u.role==="admin"?"管理员":"用户";var sl=u.status?"正常":"禁用";var bl=u.status?"#e17055":"#00b894";var tl=u.status?"禁用":"启用";return"<tr><td>"+u.id+"</td><td>"+u.username+"</td><td>"+(u.nickname||"-")+"</td><td>"+rl+"</td><td>"+sl+"</td><td>"+new Date(u.created_at).toLocaleString("zh-CN")+"</td><td><button class=\"btn bs\" style=\"background:"+bl+";color:#fff\" onclick=\"tu("+u.id+")\">"+tl+"</button></td></tr>"}).join("")||"<tr><td colspan=\"7\" class=\"empty\">暂无用户</td></tr>"}}
async function lc(){var r=await api("/categories");if(r.code===0){document.getElementById("categoriesTable").innerHTML=(r.data||[]).map(function(c){return"<tr><td>"+c.id+"</td><td>"+c.name+"</td><td>"+c.sort_order+"</td><td><button class=\"btn bd bs\" onclick=\"dc("+c.id+")\">删除</button></td></tr>"}).join("")||"<tr><td colspan=\"4\" class=\"empty\">暂无分类</td></tr>";var s=document.getElementById("uc");if(s)s.innerHTML="<option value=\"\">无分类</option>"+(r.data||[]).map(function(c){return"<option value=\""+c.id+"\">"+c.name+"</option>"}).join("")}}
document.getElementById("uf").addEventListener("submit",async function(e){e.preventDefault();var f=new FormData;f.append("title",e.target.title.value);f.append("artist",e.target.artist.value);f.append("album",e.target.album.value);f.append("category_id",e.target.category_id.value);f.append("lyrics",e.target.lyrics.value);if(e.target.music_file.files[0])f.append("music_file",e.target.music_file.files[0]);if(e.target.cover_file.files[0])f.append("cover_file",e.target.cover_file.files[0]);var r=await fetch(API+"/admin/songs/upload",{method:"POST",headers:{Authorization:"Bearer "+token},body:f});var d=await r.json();if(d.code===0){toast("上传成功");cm("uploadModal");ls();ld()}else toast(d.message)});
document.getElementById("cf").addEventListener("submit",async function(e){e.preventDefault();var f=e.target;var r=await api("/admin/categories",{method:"POST",body:JSON.stringify({name:f.name.value,sort_order:parseInt(f.sort_order.value)||0})});if(r.code===0){toast("创建成功");cm("categoryModal");lc()}else toast(r.message)});
async function ds(id){if(!confirm("确定删除歌曲？"))return;var r=await api("/admin/songs/"+id,{method:"DELETE"});if(r.code===0){toast("删除成功");ls();ld()}else toast(r.message)}
async function dc(id){if(!confirm("确定删除分类？"))return;var r=await api("/admin/categories/"+id,{method:"DELETE"});if(r.code===0){toast("删除成功");lc()}else toast(r.message)}
async function tu(id){var r=await api("/admin/users/"+id+"/toggle",{method:"PUT"});if(r.code===0){toast("操作成功");lu()}else toast(r.message)}
function showUploadModal(){document.getElementById("uploadModal").classList.add("active")}
function showCatModal(){document.getElementById("categoryModal").classList.add("active")}
function showUserModal(){document.getElementById("userModal").classList.add("active")}
document.getElementById("userForm").addEventListener("submit",async function(e){e.preventDefault();var f=e.target;var u=f.querySelector('[name="username"]');var p=f.querySelector('[name="password"]');var n=f.querySelector('[name="nickname"]');var ro=f.querySelector('[name="role"]');if(!u||!u.value.trim()){toast("请输入用户名");return}if(!p||p.value.length<6){toast("密码长度不能少于6位");return}var r=await api("/admin/users",{method:"POST",body:{username:u.value.trim(),password:p.value,nickname:n?n.value.trim():"",role:ro?ro.value:"user"}});if(r.code===0){toast("用户创建成功");cm("userModal");lu()}else toast(r.message)});
function cm(id){document.getElementById(id).classList.remove("active")}
document.querySelectorAll(".mb").forEach(function(m){m.addEventListener("click",function(e){if(e.target===m)m.classList.remove("active")})});
var st;function dss(){clearTimeout(st);st=setTimeout(function(){ls()},400)}
var ut;function dsu(){clearTimeout(ut);ut=setTimeout(function(){lu()},400)}
ld();ls();lu();lc();
</script>
</body>
</html>
