<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicSite</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>\u{1F3B5}</text></svg>">
    <link rel="stylesheet" href="/assets/css/app.css?v=6">
</head>
<body>

    





    <div id="app">
        <header class="top-bar">
            <div class="top-bar-left">
                <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="15" y2="12"></line>
                    <line x1="3" y1="18" x2="18" y2="18"></line>
                </svg>
            </div>
            <nav class="top-tabs">
                <button class="tab active" data-tab="discover">发现</button>
                <button class="tab" data-tab="mine">我的</button>
            </nav>
            <div class="top-bar-right" id="userAvatar">
                <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 12c2.5 0 4.5-2 4.5-4.5S14.5 3 12 3 7.5 5 7.5 7.5 9.5 12 12 12z"></path>
                    <path d="M20 21c0-3.3-3.6-6-8-6s-8 2.7-8 6"></path>
                </svg>
            </div>
        </header>

        <main class="page active" id="page-discover">
            <div class="search-bar">
                <svg class="icon search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索歌曲、歌手..." autocomplete="off">
            </div>

            <section class="section">
                <div class="category-scroll" id="categoryList"></div>
            </section>

            <section class="section">
                <h2 class="section-title">热门推荐</h2>
                <div class="song-list" id="hotList"></div>
            </section>

            <section class="section">
                <h2 class="section-title">最新上架</h2>
                <div class="song-list" id="latestList"></div>
            </section>
        </main>

        <main class="page" id="page-mine">
            <div class="mine-header" id="mineHeader">
                <div class="mine-login-prompt" id="loginPrompt">
                    <div class="avatar-large">
                        <svg class="icon" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 12c2.5 0 4.5-2 4.5-4.5S14.5 3 12 3 7.5 5 7.5 7.5 9.5 12 12 12z"></path>
                            <path d="M20 21c0-3.3-3.6-6-8-6s-8 2.7-8 6"></path>
                        </svg>
                    </div>
                    <p class="login-text">点击登录</p>
                </div>
                <div class="mine-profile hidden" id="userProfile">
                    <img class="avatar-large" id="userAvatarImg" src="" alt="">
                    <div class="profile-info">
                        <h3 id="userNickname"></h3>
                        <p id="userRole"></p>
                    </div>
                </div>
            </div>

            <div class="mine-menu">
                <div class="menu-item" data-action="favorites">
                    <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span>我的收藏</span>
                    <svg class="icon arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
                <div class="menu-item" data-action="history">
                    <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>播放历史</span>
                    <svg class="icon arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
                <div class="menu-item" data-action="admin" id="adminMenuBtn">
                    <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                    <span>后台管理</span>
                    <svg class="icon arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
                <div class="menu-item" data-action="logout" id="logoutBtn">
                    <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>退出登录</span>
                    <svg class="icon arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>

            <div class="sub-page hidden" id="sub-favorites">
                <div class="sub-header">
                    <button class="back-btn" data-back>
                        <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <h2>我的收藏</h2>
                </div>
                <div class="song-list" id="favoritesList"></div>
            </div>

            <div class="sub-page hidden" id="sub-history">
                <div class="sub-header">
                    <button class="back-btn" data-back>
                        <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <h2>播放历史</h2>
                </div>
                <div class="song-list" id="historyList"></div>
            </div>
        </main>

        <div class="mini-player" id="miniPlayer">
            <div class="mini-progress">
                <div class="mini-progress-bar" id="miniProgress"></div>
            </div>
            <div class="mini-content" id="miniContent">
                <img class="mini-cover" id="miniCover" src="/assets/images/default-cover.svg" alt="">
                <div class="mini-info">
                    <p class="mini-title" id="miniTitle">未播放</p>
                    <p class="mini-artist" id="miniArtist">\u2014</p>
                </div>
                <div class="mini-controls">
                    <button class="mini-btn" id="miniPlayBtn">
                        <svg class="icon play-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <svg class="icon pause-icon hidden" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>
                    <button class="mini-btn" id="miniNextBtn">
                        <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <polygon points="5 4 15 12 5 20 5 4"></polygon>
                            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="full-player" id="fullPlayer">
            <div class="full-player-bg" id="fullPlayerBg"></div>
            <div class="full-player-content">
                <div class="full-header">
                    <button class="full-back" id="fullBack">
                        <svg class="icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <div class="full-info">
                        <h2 class="full-title" id="fullTitle">\u2014</h2>
                        <p class="full-artist" id="fullArtist">\u2014</p>
                    </div>
                </div>

                <div class="cover-area">
                    <div class="vinyl-container" id="vinylContainer">
                        <div class="vinyl-disc" id="vinylDisc">
                            <div class="vinyl-cover" id="vinylCover"></div>
                            <div class="vinyl-center"></div>
                        </div>
                    </div>
                </div>

                <div class="lyrics-area" id="lyricsArea">
                    <div class="lyrics-scroll" id="lyricsScroll">
                        <p class="lyric-placeholder">暂无歌词</p>
                    </div>
                </div>

                <div class="progress-area">
                    <span class="time-current" id="timeCurrent">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-track">
                            <div class="progress-fill" id="progressFill"></div>
                            <div class="progress-thumb" id="progressThumb"></div>
                        </div>
                    </div>
                    <span class="time-total" id="timeTotal">0:00</span>
                </div>

                <div class="full-controls">
                    <button class="ctrl-btn" id="modeBtn" title="播放模式">
                        <svg class="icon mode-sequence" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                        <svg class="icon mode-shuffle hidden" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="20" x2="21" y2="3"></line>
                            <polyline points="21 16 21 21 16 21"></polyline>
                            <line x1="15" y1="15" x2="21" y2="21"></line>
                            <line x1="4" y1="4" x2="9" y2="9"></line>
                        </svg>
                        <svg class="icon mode-repeat hidden" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                    </button>
                    <button class="ctrl-btn" id="prevBtn">
                        <svg class="icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                            <polygon points="19 20 9 12 19 4 19 20"></polygon>
                            <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line>
                        </svg>
                    </button>
                    <button class="ctrl-btn play-btn" id="fullPlayBtn">
                        <svg class="icon play-icon" viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polygon points="10 8 16 12 10 16 10 8" fill="#1a1a2e"></polygon>
                        </svg>
                        <svg class="icon pause-icon hidden" viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
                            <circle cx="12" cy="12" r="10"></circle>
                            <rect x="9" y="7" width="4" height="10" rx="1" fill="#1a1a2e"></rect>
                            <rect x="13" y="7" width="4" height="10" rx="1" fill="#1a1a2e"></rect>
                        </svg>
                    </button>
                    <button class="ctrl-btn" id="nextBtn">
                        <svg class="icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                            <polygon points="5 4 15 12 5 20 5 4"></polygon>
                            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line>
                        </svg>
                    </button>
                    <button class="ctrl-btn" id="favBtn">
                        <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

       </div>


        <div class="toast" id="toast"></div>
    </div>

    <script src="/assets/js/app.js?v=4"></script>
</body>
</html>
